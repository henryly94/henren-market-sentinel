name: Market Sentinel — Smart Data Fetch & Pages Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发原因（可选）"
        required: false
        default: "mobile_manual_dispatch"
  schedule:
    # 美东 08:00 - 17:40 ET (覆盖 SOFR 放榜、美股全天盘中、ON RRP 结果与盘后 FRED 更新)：每 20 分钟自动巡检
    - cron: "*/20 13-22 * * 1-5"
    # 亚欧盘夜间黄金与离岸汇率巡检：每 4 小时一次
    - cron: "0 2,6,10 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: "gh-pages-market-sentinel"
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Python syntax
        run: python3 -m py_compile cli.py server.py sentinel/*.py

      - name: Fetch previous cloud history.json
        run: |
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/history.json" -o /tmp/prev_history.json || true

      - name: Collect live market data, run 5-layer analysis & build PWA
        run: |
          TRIG="${{ github.event_name }}"
          if [ "$TRIG" = "schedule" ]; then TRIG="smart_cron"; fi
          python3 cli.py --trigger "$TRIG" --seed-history /tmp/prev_history.json --export-static-site dist

      - name: Publish dist directly to gh-pages branch & trigger Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C dist init -b gh-pages
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add -A
          git -C dist commit -m "chore(pages): live market snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git -C dist push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
